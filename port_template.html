<meta charset="UTF-8" />
<title>Container Port DES — Two-Slip Panamax Terminal</title>
<style>
  :root {
    --bg: #eef3f4;
    --panel: rgba(255,255,255,0.82);

    --accent-rgb: 14,138,118;
    --amber: #b5762b;
    --red: #b5402b;

    --water: #cfe3e6;
    --quay: #d7cdb8;
    --yard-empty: #e4ded0;
    --font-ui: -apple-system, "Segoe UI Semibold", "Segoe UI", Roboto, sans-serif;
    --font-mono: "Cascadia Mono", "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a141f; --panel: rgba(16,28,43,0.82); --panel-solid: #101c2b;
      --ink: #dde6ea; --muted: #7d93a3; --accent: #45e0c4; --accent-rgb: 69,224,196;
      --amber: #e2a25a; --red: #e2705a; --line: rgba(221,230,234,0.14);
      --water: #0e2233; --quay: #2a2718; --yard-empty: #1a2230;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a141f; --panel: rgba(16,28,43,0.82); --panel-solid: #101c2b;
    --ink: #dde6ea; --muted: #7d93a3; --accent: #45e0c4; --accent-rgb: 69,224,196;
    --amber: #e2a25a; --red: #e2705a; --line: rgba(221,230,234,0.14);
    --water: #0e2233; --quay: #2a2718; --yard-empty: #1a2230;
  }
  :root[data-theme="light"] {
    --bg: #eef3f4; --panel: rgba(255,255,255,0.82); --panel-solid: #ffffff;
    --ink: #12212c; --muted: #56707f; --accent: #0e8a76; --accent-rgb: 14,138,118;
    --amber: #b5762b; --red: #b5402b; --line: rgba(18,33,44,0.14);
    --water: #cfe3e6; --quay: #d7cdb8; --yard-empty: #e4ded0;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; width: 100%; height: 100%; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; }

  .corner { position: absolute; z-index: 2; }
  #wordmark { top: 18px; left: 20px; pointer-events: none; }
  #wordmark .brand {
    font-weight: 700; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink);
  }
  #wordmark .sub {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    margin-top: 3px; max-width: 380px; line-height: 1.5;
  }
  #wordmark .sub a { pointer-events: auto; }

  #stats {
    top: 18px; right: 20px; z-index: 2;
    background: var(--panel); backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);

  }
  #stats .row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  #stats .row b { color: var(--ink); font-weight: 600; }
  #stats .hdr { color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 4px; }

  #hud {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 3; display: flex; align-items: center; gap: 12px;
    background: var(--panel); backdrop-filter: blur(14px) saturate(1.4);

  #hud .time {

  #themeToggle {

  /* -- simulation control panel ----------------------------------------- */
  #controls {
    display: none;

    background: var(--panel); backdrop-filter: blur(14px) saturate(1.4);

  #controls.open { display: block; }
  #controls .hdr { color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: 0.08em;

  #controls .field { margin-bottom: 10px; }
  #controls label { display: flex; justify-content: space-between; margin-bottom: 3px; color: var(--muted); }
  #controls label span { color: var(--ink); font-weight: 600; }
  #controls input[type=range] { width: 100%; accent-color: var(--accent); display: block; }
  #controls input[type=number] {
    font-family: var(--font-mono); font-size: 11px; background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; width: 90px;
  }
  #controls details { margin: 10px 0 6px; border-top: 1px solid var(--line); padding-top: 9px; }
  #controls summary {
    cursor: pointer; color: var(--ink); font-weight: 600; text-transform: uppercase;

  #controls .seedRow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #controls .ctlBtns { display: flex; gap: 8px; margin-top: 12px; }
  #controls button {
    appearance: none; border: 1px solid var(--line); background: var(--accent);
    color: #06251f; border-radius: 8px; padding: 7px 10px; font-family: var(--font-mono);
    font-weight: 600; font-size: 10.5px; cursor: pointer; flex: 1;
  }
  #controls button#resetBtn { background: transparent; color: var(--ink); }
  #controls button#randSeedBtn { flex: 0 0 auto; padding: 6px 9px; background: transparent; color: var(--ink); }
  #runStatus { margin-top: 9px; font-size: 10px; line-height: 1.6; min-height: 13px; }

  a.gh { color: var(--accent); text-decoration: none; }

<script>
const DATA = /*__PORT_DATA__*/;

// =======================================================================
// In-browser port DES -- a JS port of port_model.py's PortSim so the
// control panel below can re-run the sim with different parameters
// instantly, client-side, no server round trip (this page has always been
// "no server, no dependencies"; this keeps that true while making the
// parameters live instead of baked-in-at-build-time only).
//
// It's a from-scratch reimplementation, not a shared codebase with
// port_model.py -- if you change PortParams there, mirror the change here
// too. Structurally it follows the same shape on purpose: a tiny SimPy-like
// event engine (events/processes/resources built on JS generators, which
// map onto SimPy's yield-based coroutines almost 1:1), then a fairly
// direct translation of PortSim / ship_process / _do_move / _truck_return.
// =======================================================================
const runPortSimJS = (function () {

  // -- seeded RNG (mulberry32) + the two distributions the model needs.
  // Not bit-identical to Python's random module, just the same shapes. --
  function makeRng(seed) {
    let s = seed >>> 0;
    const next = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      expovariate(rate) { return -Math.log(1 - next()) / rate; },
      triangular(low, high, mode) {
        const u = next();
        const c = (mode - low) / (high - low);
        return u < c
          ? low + Math.sqrt(u * (high - low) * (mode - low))
          : high - Math.sqrt((1 - u) * (high - low) * (high - mode));
      },
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      },
    };
  }

  // -- minimal SimPy-like core: an event, a binary-heap-scheduled
  // environment, a generator-driven process runner, and the three
  // resource types port_model.py actually uses (Resource, Container,
  // and a token Store for the interchangeable berth pool). --
  class SEvent {
    constructor() { this.triggered = false; this.value = undefined; this._cbs = []; }
    succeed(value) {
      if (this.triggered) return;
      this.value = value; this.triggered = true;
      const cbs = this._cbs; this._cbs = [];
      for (const cb of cbs) cb(this);
    }
    then(cb) { this.triggered ? cb(this) : this._cbs.push(cb); }
  }

  class Environment {
    constructor() { this.now = 0; this._heap = []; this._seq = 0; }
    _cmp(a, b) { return a.time !== b.time ? a.time - b.time : a.seq - b.seq; }
    _push(time, action) {
      const heap = this._heap;
      heap.push({ time, seq: this._seq++, action });
      let i = heap.length - 1;
      while (i > 0) {
        const parent = (i - 1) >> 1;
        if (this._cmp(heap[i], heap[parent]) < 0) {
          [heap[i], heap[parent]] = [heap[parent], heap[i]]; i = parent;
        } else break;
      }
    }
    _pop() {
      const heap = this._heap;
      const top = heap[0];
      const last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = i * 2 + 1, r = l + 1;
          let smallest = i;
          if (l < heap.length && this._cmp(heap[l], heap[smallest]) < 0) smallest = l;
          if (r < heap.length && this._cmp(heap[r], heap[smallest]) < 0) smallest = r;
          if (smallest === i) break;
          [heap[i], heap[smallest]] = [heap[smallest], heap[i]];
          i = smallest;
        }
      }
      return top;
    }
    timeout(delay, value) {
      const ev = new SEvent();
      this._push(this.now + delay, () => ev.succeed(value));
      return ev;
    }
    // runs a no-arg generator function; returns an event that fires when
    // the generator completes (SimPy's Process is itself such an event --
    // that's what lets ship_process `yield` a crane worker to join it).
    process(genFn) {
      const doneEv = new SEvent();
      const gen = genFn();
      const step = (sent) => {
        let res;
        try { res = gen.next(sent); }
        catch (e) { console.error(e); doneEv.succeed(); return; }
        if (res.done) { doneEv.succeed(res.value); return; }
        res.value.then((ev) => step(ev.value));
      };
      step(undefined);
      return doneEv;
    }
    run(until) {
      while (this._heap.length && this._heap[0].time <= until) {
        const item = this._pop();
        this.now = item.time;
        item.action();
      }
      this.now = until;
    }
  }

  class Resource {
    constructor(capacity) { this.capacity = capacity; this.count = 0; this.queue = []; }
    request() {
      const ev = new SEvent();
      this.queue.push(ev);
      this._trigger();
      return ev;
    }
    release() { this.count--; this._trigger(); }
    _trigger() {
      while (this.queue.length && this.count < this.capacity) {
        const ev = this.queue.shift();
        this.count++;
        ev.succeed();
      }
    }
  }

  class Container {
    constructor(capacity, init) {
      this.capacity = capacity; this.level = init;
      this._puts = []; this._gets = [];
    }
    put(amount) {
      const ev = new SEvent();
      this._puts.push({ ev, amount });
      this._trigger();
      return ev;
    }
    get(amount) {
      const ev = new SEvent();
      this._gets.push({ ev, amount });
      this._trigger();
      return ev;
    }
    _trigger() {
      let changed = true;
      while (changed) {
        changed = false;
        if (this._puts.length) {
          const head = this._puts[0];
          if (this.level + head.amount <= this.capacity + 1e-9) {
            this.level += head.amount; this._puts.shift(); head.ev.succeed(); changed = true;
          }
        }
        if (this._gets.length) {
          const head = this._gets[0];
          if (this.level - head.amount >= -1e-9) {
            this.level -= head.amount; this._gets.shift(); head.ev.succeed(); changed = true;
          }
        }
      }
    }
  }

  class TokenStore {
    constructor() { this.items = []; this._gets = []; }
    put(item) {
      this.items.push(item);
      while (this._gets.length && this.items.length) this._gets.shift().succeed(this.items.shift());
      const ev = new SEvent(); ev.succeed(); return ev;
    }
    get() {
      const ev = new SEvent();
      if (this.items.length) ev.succeed(this.items.shift());
      else this._gets.push(ev);
      return ev;
    }
  }

  const SHIP_NAMES = [
    "MV Pacific Vanguard", "MV Meridian Star", "MV Cape Falcon", "MV Nordic Trader",
    "MV Golden Horizon", "MV Blue Ensign", "MV Southern Cross", "MV Coral Voyager",
    "MV Atlas Bridge", "MV Harbor King", "MV Silver Current", "MV Amber Tide",
    "MV Iron Compass", "MV Northern Wake", "MV Crimson Pilot", "MV Sea Aster",
  ];

  function round2(x) { return Math.round(x * 100) / 100; }
  function mean(xs) { return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0; }
  function percentile(xs, q) {
    if (!xs.length) return 0;
    const s = [...xs].sort((a, b) => a - b);
    return s[Math.min(s.length - 1, Math.floor(q * s.length))];
  }

  // -- the model: a fairly direct translation of PortSim / ship_process /
  // _do_move / _truck_return from port_model.py. See that file's
  // docstrings (especially on _do_move) for *why* it's shaped this way --
  // the crane/truck decoupling there is the whole point of the model. --
  function runPortSimJS(paramsInput) {
    const p = { random_seed: 42, ...paramsInput };
    const env = new Environment();
    const rng = makeRng(p.random_seed);

    const berths = new TokenStore();
    for (let i = 0; i < p.n_slips; i++) berths.put(i);
    const cranes = [];
    for (let i = 0; i < p.n_slips; i++) cranes.push(new Resource(p.cranes_per_slip));
    const trucks = new Resource(p.n_trucks);
    const yard = new Container(p.yard_capacity_teu, p.yard_capacity_teu * 0.2);
    const exportPool = new Container(p.export_pool_capacity_teu, p.export_pool_capacity_teu * 0.2);

    const anchorage = [];
    const shipsAtSlip = {};
    const completedShips = [];
    let movesCompleted = 0;
    let craneBusyHours = 0, truckBusyHours = 0;
    let nextShipId = 0;
    const samples = [];

    const nameCycle = rng.shuffle(SHIP_NAMES.slice());
    function nextName() {
      const name = nameCycle[nextShipId % nameCycle.length];
      const cycleNum = Math.floor(nextShipId / nameCycle.length);
      return cycleNum === 0 ? name : `${name} (${cycleNum + 1})`;
    }

    function* doMove(move, cranePool) {
      // gate on yard capacity / export inventory first, same order as
      // port_model.py, so a truck isn't held hostage on yard/pool space
      if (move === "discharge") yield yard.put(1);
      else yield exportPool.get(1);

      const truckReq = trucks.request();
      yield truckReq;
      const truckStart = env.now;

      const craneReq = cranePool.request();
      yield craneReq;
      const craneStart = env.now;
      yield env.timeout(rng.expovariate(1 / p.crane_move_minutes) / 60);
      cranePool.release();
      craneBusyHours += env.now - craneStart;

      // crane is free again immediately; the truck's return trip runs as
      // its own independent process so it never blocks the next box
      env.process(function* () {
        yield env.timeout(rng.expovariate(1 / p.truck_round_trip_minutes) / 60);
        truckBusyHours += env.now - truckStart;
        trucks.release();
      });
    }

    function* shipProcess(ship) {
      anchorage.push(ship.id);
      const slipId = yield berths.get();
      anchorage.splice(anchorage.indexOf(ship.id), 1);
      ship.slip_assigned_time = env.now;
      ship.slip_id = slipId;

      const moves = [];
      for (let i = 0; i < ship.discharge_teu; i++) moves.push("discharge");
      for (let i = 0; i < ship.load_teu; i++) moves.push("load");
      const cursor = { i: 0 };
      shipsAtSlip[slipId] = {
        id: ship.id, name: ship.name, discharge: ship.discharge_teu, load: ship.load_teu,
        moves_done: 0, moves_total: moves.length,
      };

      const cranePool = cranes[slipId];
      const workers = [];
      for (let w = 0; w < p.cranes_per_slip; w++) {
        workers.push(env.process(function* () {
          while (cursor.i < moves.length) {
            const move = moves[cursor.i]; cursor.i++;
            yield* doMove(move, cranePool);
            movesCompleted++;
            shipsAtSlip[slipId].moves_done++;
          }
        }));
      }
      for (const w of workers) yield w;

      ship.departure_time = env.now;
      delete shipsAtSlip[slipId];
      completedShips.push(ship);
      yield berths.put(slipId);
    }

    function* shipGenerator() {
      while (true) {
        yield env.timeout(rng.expovariate(1 / p.ship_interarrival_mean_hours));
        const ship = {
          id: nextShipId, name: nextName(),
          discharge_teu: Math.floor(rng.triangular(p.discharge_teu_min, p.discharge_teu_max, p.discharge_teu_mode)),
          load_teu: Math.floor(rng.triangular(p.load_teu_min, p.load_teu_max, p.load_teu_mode)),
          arrival_time: env.now,
          slip_assigned_time: null, slip_id: null, departure_time: null,
        };
        nextShipId++;
        env.process(() => shipProcess(ship));
      }
    }

    function* yardPickupProcess() {
      while (true) {
        yield env.timeout(rng.expovariate(1 / p.yard_pickup_mean_minutes) / 60);
        if (yard.level >= 1) yield yard.get(1);
      }
    }
    function* gateInProcess() {
      while (true) {
        yield env.timeout(rng.expovariate(1 / p.gate_in_mean_minutes) / 60);
        if (exportPool.level + 1 <= exportPool.capacity) yield exportPool.put(1);
      }
    }
    function* sampler() {
      while (true) {
        samples.push({
          t: round2(env.now),
          anchorage: anchorage.slice(),
          slip_ships: Array.from({ length: p.n_slips }, (_, i) => shipsAtSlip[i] || null),
          crane_busy: cranes.map((c) => c.count),
          crane_cap: cranes.map((c) => c.capacity),
          truck_busy: trucks.count,
          truck_queue: trucks.queue.length,
          truck_cap: trucks.capacity,
          yard_level: Math.round(yard.level * 10) / 10,
          yard_cap: yard.capacity,
          export_level: Math.round(exportPool.level * 10) / 10,
          export_cap: exportPool.capacity,
          ships_completed: completedShips.length,
          moves_completed: movesCompleted,
        });
        yield env.timeout(p.sample_interval_hours);
      }
    }

    env.process(shipGenerator);
    env.process(yardPickupProcess);
    env.process(gateInProcess);
    env.process(sampler);
    env.run(p.sim_days * 24);

    const shipsPayload = completedShips.map((s) => {
      const turnaround = s.departure_time != null ? s.departure_time - s.arrival_time : null;
      const wait = s.slip_assigned_time != null ? s.slip_assigned_time - s.arrival_time : null;
      return {
        id: s.id, name: s.name, discharge: s.discharge_teu, load: s.load_teu,
        arrival: round2(s.arrival_time),
        slip_assigned: s.slip_assigned_time != null ? round2(s.slip_assigned_time) : null,
        slip_id: s.slip_id,
        departure: s.departure_time != null ? round2(s.departure_time) : null,
        turnaround: turnaround != null ? round2(turnaround) : null,
        wait: wait != null ? round2(wait) : null,
      };
    }).sort((a, b) => a.arrival - b.arrival);

    const turnarounds = shipsPayload.map((s) => s.turnaround).filter((v) => v != null);
    const waits = shipsPayload.map((s) => s.wait).filter((v) => v != null);
    const totalCraneCapacityHours = p.n_slips * p.cranes_per_slip * p.sim_days * 24;
    const totalTruckCapacityHours = p.n_trucks * p.sim_days * 24;

    const stats = {
      ships_completed: completedShips.length,
      ships_still_in_system: nextShipId - completedShips.length,
      avg_turnaround_hours: mean(turnarounds),
      p90_turnaround_hours: percentile(turnarounds, 0.90),
      avg_anchorage_wait_hours: mean(waits),
      pct_ships_that_waited: waits.length ? 100 * waits.filter((w) => w > 0.01).length / waits.length : 0,
      total_moves_completed: movesCompleted,
      moves_per_day: movesCompleted / p.sim_days,
      crane_utilization_pct: 100 * craneBusyHours / totalCraneCapacityHours,
      truck_utilization_pct: 100 * truckBusyHours / totalTruckCapacityHours,
      final_yard_level_pct: 100 * yard.level / yard.capacity,
      final_export_pool_pct: 100 * exportPool.level / exportPool.capacity,
    };

    return { params: { ...p }, stats, ships: shipsPayload, samples };
  }

  return runPortSimJS;
})();

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------------------------------------------------------------------
// active dataset (either the Python-baked DATA, or the output of a live
// runPortSimJS() call from the control panel) + playback state
// ---------------------------------------------------------------------
let activeData, shipsById, samples, dt, simDays, nSlips, cranesPerSlip;

let playing = true;
let speed = 24; // simulated hours per real second
let simTime = 0; // hours
let lastFrameMs = null;

const scrub = document.getElementById('scrub');
const timeLabel = document.getElementById('timeLabel');
const playBtn = document.getElementById('playBtn');
const speedSel = document.getElementById('speedSel');

function sampleAt(t) {
  let idx = Math.floor(t / dt);
  if (idx < 0) idx = 0;
  if (idx >= samples.length) idx = samples.length - 1;
  return samples[idx];
}

function setSimTime(t) {
  simTime = Math.max(0, Math.min(t, samples.length * dt - dt));
  scrub.value = Math.round(simTime / dt);
  timeLabel.textContent = `day ${(simTime / 24).toFixed(2)} / ${simDays.toFixed(0)}`;
}

function applyDataset(data, sourceLabel) {
  activeData = data;
  shipsById = {};
  for (const s of data.ships) shipsById[s.id] = s;
  samples = data.samples;
  dt = data.params.sample_interval_hours;
  simDays = data.params.sim_days;
  nSlips = data.params.n_slips;
  cranesPerSlip = data.params.cranes_per_slip;
  scrub.max = samples.length - 1;
  setSimTime(0);
  updateWordmark(data.params, sourceLabel);
  updateRunStatus(data, sourceLabel);
}

function updateWordmark(p, sourceLabel) {
  const sub = document.querySelector('#wordmark .sub');
  const totalCranes = p.n_slips * p.cranes_per_slip;
  sub.innerHTML =
    `${p.n_slips}-slip Panamax terminal &middot; ${totalCranes} quay cranes &middot; ` +
    `${p.n_trucks} shared trucks &middot; <em>${sourceLabel}</em>.<br>` +
    `A discrete-event simulation (<a class="gh" href="https://simpy.readthedocs.io/" target="_blank" rel="noopener">SimPy</a>` +
    (sourceLabel.indexOf('in-browser') !== -1 ? ' logic, ported to JS' : '') +
    `), spun out of <a class="gh" href="https://github.com/mathewsgreg/planet_sim" target="_blank" rel="noopener">planet_sim</a>.`;
}

function updateRunStatus(data, sourceLabel) {
  const el = document.getElementById('runStatus');
  if (!el) return;
  if (sourceLabel === 'Python (baked default)') {
    el.textContent = 'showing the baked default run';
    return;
  }
  const st = data.stats;
  el.innerHTML =
    `ships completed: <b style="color:var(--ink)">${st.ships_completed}</b> &middot; ` +
    `avg turnaround: <b style="color:var(--ink)">${st.avg_turnaround_hours.toFixed(1)}h</b><br>` +
    `crane util: <b style="color:var(--ink)">${st.crane_utilization_pct.toFixed(0)}%</b> &middot; ` +
    `truck util: <b style="color:var(--ink)">${st.truck_utilization_pct.toFixed(0)}%</b>`;
}

};

function setControlsFromParams(p) {
  for (const key of Object.keys(CTL)) {
    const [inputId, labelId, fmt] = CTL[key];
    document.getElementById(inputId).value = p[key];
    document.getElementById(labelId).textContent = fmt(p[key]);
  }

}

for (const key of Object.keys(CTL)) {
  const [inputId, labelId, fmt] = CTL[key];
  document.getElementById(inputId).addEventListener('input', (e) => {
    document.getElementById(labelId).textContent = fmt(e.target.value);
  });
}

function collectParamsFromControls() {
  const p = { ...FIXED_EXTRA_PARAMS };
  for (const key of Object.keys(CTL)) {
    p[key] = parseFloat(document.getElementById(CTL[key][0]).value);
  }
  p.sim_days = Math.round(p.sim_days);
  p.n_slips = Math.round(p.n_slips);

  p.n_trucks = Math.round(p.n_trucks);
  p.random_seed = parseInt(document.getElementById('c_seed').value, 10);
  if (!Number.isFinite(p.random_seed)) p.random_seed = 42;

// ---------------------------------------------------------------------
// layout (schematic, in CSS pixels, recomputed each frame from W/H)
// ---------------------------------------------------------------------
function layout() {
  const padL = 40, padR = 40, padT = 100, padB = 110;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const anchorageW = Math.min(150, plotW * 0.14);
  const yardW = Math.min(230, plotW * 0.22);
  const berthW = plotW - anchorageW - yardW - 60;

  const anchorageX = padL;
  const berthX = anchorageX + anchorageW + 30;
  const yardX = berthX + berthW + 30;

  // slip rows stack to fill the available height, however many there are
  const n = Math.max(1, nSlips);
  const slipGap = plotH * (n > 1 ? 0.08 : 0);
  const slipH = (plotH - slipGap * (n - 1)) / n;
  const slips = [];
  for (let i = 0; i < n; i++) {
    slips.push({ x: berthX, y: padT + i * (slipH + slipGap), w: berthW, h: slipH });
  }

  const yardH = Math.min(plotH * 0.42, 260);
  const exportY = padT + yardH + 22;
  const truckY = slips[n - 1].y + slipH + 26;
  const truckH = Math.max(40, padT + plotH - truckY - 4);

  return {
    padL, padT, plotW, plotH,
    anchorage: { x: anchorageX, y: padT, w: anchorageW, h: plotH },
    berth: { x: berthX, w: berthW },
    slips,
    yard: { x: yardX, y: padT, w: yardW, h: yardH },
    exportPool: { x: yardX, y: exportY, w: yardW, h: Math.min(plotH * 0.28, 170) },
    truck: { x: berthX, y: truckY, w: berthW, h: truckH },
  };
}

// ---------------------------------------------------------------------
// drawing helpers
// ---------------------------------------------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function label(text, x, y, opts = {}) {
  ctx.font = `${opts.bold ? '700' : '600'} ${opts.size || 11}px var(--font-ui), sans-serif`;
  ctx.fillStyle = opts.color || cssVar('--muted');
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'alphabetic';
  ctx.fillText(text, x, y);
}

function mono(text, x, y, opts = {}) {
  ctx.font = `${opts.size || 10}px var(--font-mono), monospace`;
  ctx.fillStyle = opts.color || cssVar('--muted');
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'alphabetic';
  ctx.fillText(text, x, y);
}

function progressColor(frac) {
  // green as work progresses; used for ship discharge/load bars
  const acc = cssVar('--accent');
  return acc;
}

function drawCraneIcon(cx, cy, s, busy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = busy ? cssVar('--amber') : cssVar('--muted');
  ctx.fillStyle = busy ? cssVar('--amber') : cssVar('--muted');
  ctx.lineWidth = Math.max(1.4, s * 0.09);
  ctx.globalAlpha = busy ? 1 : 0.55;
  // A-frame gantry crane, simple pictogram
  ctx.beginPath();
  ctx.moveTo(-s * 0.55, s * 0.7); ctx.lineTo(0, -s * 0.75);
  ctx.moveTo(s * 0.55, s * 0.7); ctx.lineTo(0, -s * 0.75);
  ctx.moveTo(-s * 0.3, s * 0.2); ctx.lineTo(s * 0.3, s * 0.2);
  ctx.stroke();
  // boom
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.75); ctx.lineTo(s * 1.1, -s * 0.55);
  ctx.stroke();
  if (busy) {
    // hoisted box
    ctx.globalAlpha = 1;
    ctx.fillRect(s * 0.75, -s * 0.4, s * 0.32, s * 0.24);
  }
  ctx.restore();
}

function drawShip(x, y, w, h, dischargeFrac, loadFrac, phase) {
  ctx.save();
  ctx.translate(x, y);
  const hull = cssVar('--ink');
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = hull;
  ctx.beginPath();
  rr(0, h * 0.18, w, h * 0.5, h * 0.12);
  ctx.fill();
  // bow taper
  ctx.beginPath();
  ctx.moveTo(w, h * 0.18);
  ctx.lineTo(w + h * 0.35, h * 0.43);
  ctx.lineTo(w, h * 0.68);
  ctx.closePath();
  ctx.fill();
  // container stacks (decorative rows), kept low enough not to collide
  // with the name label drawn above the ship
  const rows = 2, cols = Math.max(4, Math.floor(w / 22));
  const colors = ['#c65b3f', '#3f7fc6', '#c6a13f', '#5fb08a'];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = colors[(r * 7 + c * 3) % colors.length];
      ctx.globalAlpha = 0.85;
      const bw = (w / cols) * 0.78, bh = (h * 0.26) / rows * 0.72;
      ctx.fillRect(6 + c * (w / cols), h * 0.16 - r * (h * 0.26 / rows), bw, bh);
    }
  }
  ctx.restore();

  // progress bar underneath: two segments, discharge then load
  const barY = y + h + 8, barW = w, barH = 6;
  ctx.fillStyle = cssVar('--line');
  rr(x, barY, barW, barH, 3); ctx.fill();
  ctx.fillStyle = cssVar('--accent');
  rr(x, barY, barW * 0.5 * dischargeFrac, barH, 3); ctx.fill();
  ctx.fillStyle = cssVar('--amber');
  rr(x + barW * 0.5, barY, barW * 0.5 * loadFrac, barH, 3); ctx.fill();
}

function drawYardGrid(x, y, w, h, level, cap, tint, title) {
  label(title, x, y - 8, { bold: true, size: 10.5 });
  const cols = 10, rows = 5;
  const gap = 3;
  const cw = (w - gap * (cols - 1)) / cols;
  const ch = (h - gap * (rows - 1)) / rows;
  const filledCells = Math.round((level / cap) * cols * rows);
  let i = 0;
  for (let r = rows - 1; r >= 0; r--) {
    for (let c = 0; c < cols; c++) {
      const cx = x + c * (cw + gap), cy = y + r * (ch + gap);
      ctx.fillStyle = i < filledCells ? tint : cssVar('--yard-empty');
      ctx.globalAlpha = i < filledCells ? 0.9 : 0.6;
      rr(cx, cy, cw, ch, 2); ctx.fill();
      i++;
    }
  }
  ctx.globalAlpha = 1;
  mono(`${Math.round(level)} / ${Math.round(cap)} TEU  (${(100 * level / cap).toFixed(0)}%)`,
       x, y + h + 14, { size: 10 });
}

function drawTrucks(x, y, w, h, busy, queue, cap) {
  label('Truck Pool (shared, quay ↔ yard/gate)', x, y - 8, { bold: true, size: 10.5 });
  const n = cap;
  const cols = Math.min(n, Math.max(6, Math.floor(w / 26)));
  const rows = Math.ceil(n / cols);
  const cw = Math.min(22, (w - (cols - 1) * 6) / cols);
  const ch = 12;
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    const tx = x + c * (cw + 6), ty = y + r * (ch + 6);
    ctx.fillStyle = i < busy ? cssVar('--amber') : cssVar('--line');
    ctx.globalAlpha = i < busy ? 0.95 : 1;
    rr(tx, ty, cw, ch, 3); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const rowsH = rows * (ch + 6);
  mono(`busy ${busy}/${cap}  ·  waiting for a truck: ${queue}`, x, y + rowsH + 12, { size: 10 });
  if (queue > 0) {
    ctx.fillStyle = cssVar('--red');
    for (let i = 0; i < Math.min(queue, 14); i++) {
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(x + rowsH * 0 + 6 + i * 11, y + rowsH + 26, 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------
// main draw
// ---------------------------------------------------------------------
function draw() {
  const s = sampleAt(simTime);
  const L = layout();
  const ink = cssVar('--ink'), muted = cssVar('--muted'), line = cssVar('--line');

  ctx.clearRect(0, 0, W, H);

  // water background behind the whole berth/yard plot
  ctx.fillStyle = cssVar('--water');
  ctx.globalAlpha = 0.5;
  rr(L.berth.x - 10, L.padT - 10, L.berth.w + 20, L.plotH + 20, 14);
  ctx.fill();
  ctx.globalAlpha = 1;

  // ---- anchorage ----
  label('Anchorage (waiting for a slip)', L.anchorage.x, L.anchorage.y - 12, { bold: true, size: 10.5 });
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  rr(L.anchorage.x, L.anchorage.y, L.anchorage.w, L.anchorage.h, 10); ctx.stroke();
  const anchoredShips = s.anchorage;
  const maxShow = Math.floor(L.anchorage.h / 46);
  anchoredShips.slice(0, maxShow).forEach((sid, i) => {
    const sh = shipsById[sid];
    const name = sh ? sh.name.replace('MV ', '') : `ship #${sid}`;
    const yy = L.anchorage.y + 14 + i * 46;
    ctx.fillStyle = ink; ctx.globalAlpha = 0.85;
    rr(L.anchorage.x + 10, yy, L.anchorage.w - 20, 26, 6); ctx.fill();
    ctx.globalAlpha = 1;
    mono(name, L.anchorage.x + 16, yy + 17, { size: 9.5, color: cssVar('--bg') });
  });
  if (anchoredShips.length > maxShow) {
    mono(`+ ${anchoredShips.length - maxShow} more`, L.anchorage.x + 10,
         L.anchorage.y + 14 + maxShow * 46 + 12, { size: 10 });
  }
  mono(`queue: ${anchoredShips.length}`, L.anchorage.x, L.anchorage.y + L.anchorage.h + 16, { size: 10.5, color: ink });

  // ---- slips + cranes ----
  for (let i = 0; i < nSlips; i++) {
    const slip = L.slips[i];
    if (!slip) continue;
    label(`Slip ${i + 1}`, slip.x, slip.y - 12, { bold: true, size: 10.5 });
    ctx.strokeStyle = line;
    rr(slip.x, slip.y, slip.w, slip.h, 10); ctx.stroke();
    // quay strip
    ctx.fillStyle = cssVar('--quay'); ctx.globalAlpha = 0.6;
    ctx.fillRect(slip.x, slip.y + slip.h * 0.7, slip.w, slip.h * 0.3);
    ctx.globalAlpha = 1;

    // cranes along the quay, evenly spread regardless of how many there are
    const craneBusy = s.crane_busy[i], craneCap = s.crane_cap[i];
    for (let c = 0; c < craneCap; c++) {
      const frac = craneCap > 1 ? c / (craneCap - 1) : 0.5;
      const ccx = slip.x + slip.w * (0.14 + frac * 0.72);
      const ccy = slip.y + slip.h * 0.62;
      drawCraneIcon(ccx, ccy, Math.min(26, slip.h * 0.22), c < craneBusy);
    }

    const occ = s.slip_ships[i];
    if (occ) {
      const shipW = Math.min(slip.w * 0.7, 230);
      const shipH = slip.h * 0.32;
      const sx = slip.x + slip.w * 0.15, sy = slip.y + slip.h * 0.08;
      const dFrac = occ.discharge > 0 ? Math.min(1, occ.moves_done / occ.discharge) : 1;
      const lFrac = occ.load > 0
        ? Math.min(1, Math.max(0, occ.moves_done - occ.discharge) / occ.load)
        : (occ.moves_done >= occ.discharge ? 1 : 0);
      drawShip(sx, sy, shipW, shipH, dFrac, lFrac);
      mono(`${occ.name}`, sx, sy - 6, { size: 10, color: ink });
      mono(`${occ.moves_done} / ${occ.moves_total} moves  ·  D:${occ.discharge} L:${occ.load}`,
           sx, sy + shipH + 22, { size: 9.5 });
    } else {
      ctx.globalAlpha = 0.5;
      mono('(empty berth)', slip.x + slip.w * 0.15, slip.y + slip.h * 0.3, { size: 10.5 });
      ctx.globalAlpha = 1;
    }
  }

  // ---- yard + export pool ----
  drawYardGrid(L.yard.x, L.yard.y + 18, L.yard.w, L.yard.h - 34, s.yard_level, s.yard_cap,
               cssVar('--amber'), 'Stacking Yard (import boxes)');
  drawYardGrid(L.exportPool.x, L.exportPool.y + 18, L.exportPool.w, L.exportPool.h - 34,
               s.export_level, s.export_cap, cssVar('--accent'), 'Export-Ready Pool (gated-in)');

  // ---- truck pool ----
  drawTrucks(L.truck.x, L.truck.y + 16, L.truck.w, L.truck.h - 16, s.truck_busy, s.truck_queue, s.truck_cap);

  // ---- stats panel ----
  const statsEl = document.getElementById('stats');
  const pctBusyCranes = (100 * s.crane_busy.reduce((a, b) => a + b, 0) /
    (nSlips * cranesPerSlip)).toFixed(0);
  statsEl.innerHTML = `
    <div class="hdr">Live State &middot; day ${(simTime / 24).toFixed(1)}</div>
    <div class="row"><span>ships completed</span><b>${s.ships_completed}</b></div>
    <div class="row"><span>moves completed</span><b>${s.moves_completed.toLocaleString()}</b></div>
    <div class="row"><span>anchorage queue</span><b>${s.anchorage.length}</b></div>
    <div class="row"><span>cranes active</span><b>${s.crane_busy.reduce((a,b)=>a+b,0)} / ${nSlips*cranesPerSlip} (${pctBusyCranes}%)</b></div>
    <div class="row"><span>trucks busy</span><b>${s.truck_busy} / ${s.truck_cap}</b></div>
    <div class="row"><span>truck queue</span><b>${s.truck_queue}</b></div>
    <div class="row"><span>yard fill</span><b>${(100*s.yard_level/s.yard_cap).toFixed(0)}%</b></div>
    <div class="row"><span>export pool</span><b>${(100*s.export_level/s.export_cap).toFixed(0)}%</b></div>
  `;

  // legend
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = `
    <div><span class="sw" style="background:${cssVar('--amber')}"></span>crane / truck busy, yard fill</div>
    <div><span class="sw" style="background:${cssVar('--accent')}"></span>discharge progress, export pool</div>
    <div><span class="sw" style="background:${cssVar('--red')}"></span>truck waiting (queued)</div>
  `;

  timeLabel.textContent = `day ${(simTime / 24).toFixed(2)} / ${simDays.toFixed(0)}`;
}

// ---------------------------------------------------------------------
// loop
// ---------------------------------------------------------------------
function frame(ms) {
  if (playing) {
    if (lastFrameMs != null) {
      const dtReal = (ms - lastFrameMs) / 1000;
      setSimTime(simTime + dtReal * speed);
      if (simTime >= samples.length * dt - dt - 0.01) {
        playing = false; playBtn.innerHTML = '&#9654;'; playBtn.classList.remove('pause');
      }
    }
    lastFrameMs = ms;
  } else {
    lastFrameMs = null;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
